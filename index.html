<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>West Bengal Land Expert</title>
<style>
  :root{
    --green:#1B7A3E; --green-dark:#12582b; --gold:#F2B705; --red:#C62828;
    --bg:#FFFBF2; --card:#ffffff; --tint:#E9F5EC; --text:#1A2A1F; --muted:#5b6b60;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans Bengali","Hind Siliguri","Noto Sans Devanagari",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
  header{background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;padding:14px 16px 28px;border-bottom:4px solid var(--gold);border-radius:0 0 24px 24px}
  .langs{display:flex;gap:8px;justify-content:flex-end;max-width:560px;margin:0 auto 10px}
  .langs button{border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;padding:6px 14px;border-radius:999px;font-size:14px;cursor:pointer;font-family:inherit}
  .langs button.active{background:var(--gold);color:#222;border-color:var(--gold);font-weight:700}
  .brand{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:14px}
  .logo{width:78px;height:78px;border-radius:50%;background:#fff;border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;flex:none}
  .logo svg{width:52px;height:60px}
  h1{margin:0;font-size:22px;line-height:1.25}
  .tag{margin:4px 0 0;color:#e7f5ea;font-size:14px}
  .dl{display:block;margin:20px 0 6px;background:var(--gold);color:#1d1d1d;text-align:center;text-decoration:none;font-weight:700;font-size:18px;padding:16px;border-radius:14px;box-shadow:0 4px 0 #c99700}
  .dl:active{transform:translateY(2px);box-shadow:0 2px 0 #c99700}
  .note{font-size:12.5px;color:var(--muted);text-align:center;margin:0 0 20px}
  .card{background:var(--card);border:1px solid #e3eadf;border-radius:16px;padding:16px;margin:16px 0;box-shadow:0 2px 8px rgba(0,0,0,.04)}
  .card h2{margin:0 0 4px;font-size:18px;color:var(--green)}
  .card p.sub{margin:0 0 12px;font-size:13.5px;color:var(--muted)}
  .row{display:flex;align-items:center;gap:10px;margin:8px 0}
  .row label{flex:0 0 92px;font-weight:600;font-size:15px}
  .row input{flex:1;min-width:0;font-size:18px;padding:10px 12px;border:2px solid #cfe2d3;border-radius:10px;background:var(--tint);font-family:inherit;color:var(--text)}
  .row input:focus{outline:none;border-color:var(--green);background:#fff}
  .rates{font-size:13px;color:var(--muted);margin-top:12px;background:#fff8e1;border-left:4px solid var(--gold);padding:8px 10px;border-radius:6px}
  .clear{margin-top:10px;background:none;border:1px solid var(--green);color:var(--green);padding:8px 16px;border-radius:10px;font-family:inherit;font-size:14px;cursor:pointer}
  ul.feat{list-style:none;padding:0;margin:0}
  ul.feat li{padding:8px 0 8px 28px;position:relative;border-bottom:1px dashed #e3eadf;font-size:15px}
  ul.feat li:last-child{border:none}
  ul.feat li::before{content:"✔";position:absolute;left:0;color:var(--green);font-weight:700}
  .soon{font-size:11px;background:var(--red);color:#fff;padding:1px 7px;border-radius:999px;margin-left:6px}
  footer{text-align:center;font-size:12.5px;color:var(--muted);padding:10px 16px 30px}
  .wave{height:6px;background:linear-gradient(90deg,var(--green),var(--gold),var(--red));border-radius:3px;margin-top:8px}
</style>
</head>
<body>

<header>
  <div class="langs">
    <button data-lang="bn" class="active">বাংলা</button>
    <button data-lang="hi">हिन्दी</button>
    <button data-lang="en">English</button>
  </div>
  <div class="brand">
    <div class="logo" aria-label="West Bengal map">
      <!-- Placeholder West Bengal outline. Replace this <svg> with your designer's real logo/map (or an <img src="logo.png">). -->
      <svg viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
        <path d="M48 4 L58 8 L66 6 L68 16 L60 22 L54 30 L56 40 L52 50 L58 58 L54 66 L46 70 L42 62 L36 58 L32 66 L34 76 L30 86 L24 94 L30 104 L38 110 L44 120 L54 126 L66 124 L78 118 L82 110 L74 104 L78 94 L72 86 L76 78 L68 70 L72 60 L66 52 L70 42 L64 34 L70 24 L64 14 Z"
              fill="#1B7A3E" stroke="#F2B705" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="52" cy="70" r="4" fill="#F2B705"/>
      </svg>
    </div>
    <div>
      <h1 data-i18n="title"></h1>
      <p class="tag" data-i18n="tagline"></p>
    </div>
  </div>
</header>

<div class="wrap">

  <!-- ====== APK LINK: replace the # below with your GitHub Release link ====== -->
  <a id="apkBtn" class="dl" href="#" data-i18n="download"></a>
  <p class="note" data-i18n="apkNote"></p>

  <section class="card">
    <h2 data-i18n="convTitle"></h2>
    <p class="sub" data-i18n="convSub"></p>
    <div id="rows"></div>
    <div class="rates" id="rates"></div>
    <button class="clear" id="clearBtn" data-i18n="clear"></button>
  </section>

  <section class="card">
    <h2 data-i18n="featTitle"></h2>
    <ul class="feat">
      <li data-i18n="f1"></li>
      <li data-i18n="f2"></li>
      <li><span data-i18n="f3"></span><span class="soon" data-i18n="soon"></span></li>
      <li><span data-i18n="f4"></span><span class="soon" data-i18n="soon"></span></li>
      <li><span data-i18n="f5"></span><span class="soon" data-i18n="soon"></span></li>
    </ul>
  </section>

</div>

<footer>
  <div class="wave"></div>
  <p data-i18n="footer"></p>
</footer>

<script>
/* =====================================================
   MAP (UNIT) SETTINGS: change values here, everything updates automatically
   ===================================================== */
const CONFIG = {
  SQFT_PER_SHATAK: 435.6,   // 1 শতক = 435.6 sq ft
  SHATAK_PER_KATHA: 2,      // 1 কাঠা = 2 শতক
  KATHA_PER_BIGHA: 20,      // 1 বিঘা = 20 কাঠা  (= 40 শতক)
  SHATAK_PER_ACRE: 100,     // 1 একর = 100 শতক
  CHHATAK_PER_KATHA: null   // ছটাক: put a number here (e.g. 16) to switch it on; null = hidden
};

/* ---------- derived: everything is measured in শতক ---------- */
const shatakPer = {
  bigha:  CONFIG.SHATAK_PER_KATHA * CONFIG.KATHA_PER_BIGHA,
  katha:  CONFIG.SHATAK_PER_KATHA,
  shatak: 1,
  acre:   CONFIG.SHATAK_PER_ACRE,
  sqft:   1 / CONFIG.SQFT_PER_SHATAK
};
if (CONFIG.CHHATAK_PER_KATHA) {
  shatakPer.chhatak = CONFIG.SHATAK_PER_KATHA / CONFIG.CHHATAK_PER_KATHA;
}

/* ---------- translations ---------- */
const T = {
  bn:{
    title:"পশ্চিমবঙ্গ জমি এক্সপার্ট", tagline:"জমি মাপুন, নিশ্চিন্তে",
    download:"⬇ অ্যাপ ডাউনলোড করুন (APK)",
    apkNote:"ফোনে ইনস্টলের সময় “অজানা উৎস” থেকে ইনস্টলের অনুমতি দিতে হতে পারে।",
    convTitle:"জমির মাপ কনভার্টার", convSub:"যেকোনো একটি ঘরে সংখ্যা লিখুন, বাকি সব নিজে থেকে হিসাব হবে।",
    bigha:"বিঘা", katha:"কাঠা", shatak:"শতক", acre:"একর", sqft:"বর্গফুট", chhatak:"ছটাক",
    clear:"সব মুছুন",
    ratesLabel:"ব্যবহৃত হিসাব:",
    r_bigha:"১ বিঘা = {a} কাঠা = {b} শতক", r_katha:"১ কাঠা = {a} শতক",
    r_shatak:"১ শতক = {a} বর্গফুট", r_acre:"১ একর = {a} শতক", r_chhatak:"১ কাঠা = {a} ছটাক",
    featTitle:"অ্যাপে যা থাকছে",
    f1:"শতক-কাঠা-বিঘা অটো কনভার্টার", f2:"জমির ক্ষেত্রফল ক্যালকুলেটর",
    f3:"মৌজা ম্যাপে জমি মাপা", f4:"সমান ভাগে জমি ভাগ", f5:"GPS দিয়ে জমি মাপা ও PDF রিপোর্ট",
    soon:"শীঘ্রই",
    footer:"© পশ্চিমবঙ্গ জমি এক্সপার্ট — পরীক্ষামূলক সংস্করণ"
  },
  hi:{
    title:"पश्चिम बंगाल लैंड एक्सपर्ट", tagline:"ज़मीन मापें, भरोसे के साथ",
    download:"⬇ ऐप डाउनलोड करें (APK)",
    apkNote:"फ़ोन में इंस्टॉल करते समय “अज्ञात स्रोत” से इंस्टॉल की अनुमति देनी पड़ सकती है।",
    convTitle:"ज़मीन माप कन्वर्टर", convSub:"किसी भी खाने में संख्या लिखें, बाकी अपने-आप गिन जाएंगे।",
    bigha:"बीघा", katha:"कट्ठा", shatak:"शतक", acre:"एकड़", sqft:"वर्ग फुट", chhatak:"छटाक",
    clear:"सब मिटाएं",
    ratesLabel:"इस्तेमाल किए गए हिसाब:",
    r_bigha:"1 बीघा = {a} कट्ठा = {b} शतक", r_katha:"1 कट्ठा = {a} शतक",
    r_shatak:"1 शतक = {a} वर्ग फुट", r_acre:"1 एकड़ = {a} शतक", r_chhatak:"1 कट्ठा = {a} छटाक",
    featTitle:"ऐप में क्या होगा",
    f1:"शतक-कट्ठा-बीघा ऑटो कन्वर्टर", f2:"ज़मीन क्षेत्रफल कैलकुलेटर",
    f3:"मौजा नक्शे पर ज़मीन मापना", f4:"बराबर हिस्सों में ज़मीन बाँटना", f5:"GPS से ज़मीन मापना और PDF रिपोर्ट",
    soon:"जल्द आ रहा है",
    footer:"© पश्चिम बंगाल लैंड एक्सपर्ट — परीक्षण संस्करण"
  },
  en:{
    title:"West Bengal Land Expert", tagline:"Measure your land with confidence",
    download:"⬇ Download the App (APK)",
    apkNote:"When installing on your phone you may need to allow installs from “unknown sources”.",
    convTitle:"Land Unit Converter", convSub:"Type a number in any box and all the others update automatically.",
    bigha:"Bigha", katha:"Katha", shatak:"Shatak", acre:"Acre", sqft:"Sq. ft", chhatak:"Chhatak",
    clear:"Clear all",
    ratesLabel:"Conversion rates used:",
    r_bigha:"1 Bigha = {a} Katha = {b} Shatak", r_katha:"1 Katha = {a} Shatak",
    r_shatak:"1 Shatak = {a} sq ft", r_acre:"1 Acre = {a} Shatak", r_chhatak:"1 Katha = {a} Chhatak",
    featTitle:"What's in the app",
    f1:"Shatak–Katha–Bigha auto converter", f2:"Land area calculator",
    f3:"Measure plots on the Mouza map", f4:"Divide land into equal parts", f5:"GPS field survey and PDF report",
    soon:"Coming soon",
    footer:"© West Bengal Land Expert — test version"
  }
};

let lang = "bn";
try { lang = localStorage.getItem("wbLang") || "bn"; } catch(e){}

/* ---------- number helpers ---------- */
const digitMap = {"০":0,"১":1,"২":2,"৩":3,"৪":4,"৫":5,"৬":6,"৭":7,"৮":8,"৯":9,
                  "०":0,"१":1,"२":2,"३":3,"४":4,"५":5,"६":6,"७":7,"८":8,"९":9};
function parseNum(s){
  s = String(s).replace(/[০-৯०-९]/g, d => digitMap[d]).replace(/,/g,"").trim();
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
function fmt(n){
  if (n === null) return "";
  const r = Math.round(n * 10000) / 10000;
  return String(r);
}
function localNum(n){
  const s = String(n);
  if (lang === "bn") return s.replace(/\d/g, d => "০১২৩৪৫৬৭৮৯"[d]);
  if (lang === "hi") return s.replace(/\d/g, d => "०१२३४५६७८९"[d]);
  return s;
}

/* ---------- build converter ---------- */
const order = ["bigha","katha","shatak","acre","sqft"].concat(shatakPer.chhatak ? ["chhatak"] : []);
const rowsEl = document.getElementById("rows");
const inputs = {};

order.forEach(u => {
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML = '<label for="in_'+u+'" data-unit="'+u+'"></label>' +
                  '<input id="in_'+u+'" inputmode="decimal" autocomplete="off" placeholder="0">';
  rowsEl.appendChild(row);
  inputs[u] = row.querySelector("input");
  inputs[u].addEventListener("input", () => {
    const v = parseNum(inputs[u].value);
    if (v === null) { order.forEach(o => { if (o !== u) inputs[o].value = ""; }); return; }
    const inShatak = v * shatakPer[u];
    order.forEach(o => { if (o !== u) inputs[o].value = fmt(inShatak / shatakPer[o]); });
  });
});

document.getElementById("clearBtn").addEventListener("click", () => {
  order.forEach(o => inputs[o].value = "");
  inputs[order[0]].focus();
});

/* ---------- apply language ---------- */
function applyLang(l){
  lang = l;
  try { localStorage.setItem("wbLang", l); } catch(e){}
  document.documentElement.lang = l;
  const d = T[l];
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = d[el.dataset.i18n]; });
  document.querySelectorAll("label[data-unit]").forEach(el => { el.textContent = d[el.dataset.unit]; });
  document.querySelectorAll(".langs button").forEach(b => b.classList.toggle("active", b.dataset.lang === l));
  document.title = d.title;

  const bigha = shatakPer.bigha;
  const lines = [
    d.r_bigha.replace("{a}", localNum(CONFIG.KATHA_PER_BIGHA)).replace("{b}", localNum(fmt(bigha))),
    d.r_katha.replace("{a}", localNum(CONFIG.SHATAK_PER_KATHA)),
    d.r_shatak.replace("{a}", localNum(CONFIG.SQFT_PER_SHATAK)),
    d.r_acre.replace("{a}", localNum(CONFIG.SHATAK_PER_ACRE))
  ];
  if (CONFIG.CHHATAK_PER_KATHA) lines.push(d.r_chhatak.replace("{a}", localNum(CONFIG.CHHATAK_PER_KATHA)));
  document.getElementById("rates").innerHTML = "<b>" + d.ratesLabel + "</b><br>" + lines.join("<br>");
}
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => applyLang(b.dataset.lang)));
applyLang(lang);
</script>
</body>
</html>
