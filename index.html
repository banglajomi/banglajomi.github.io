<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>West Bengal Land Expert</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,"Noto Sans Bengali",sans-serif}
body{background:#fffbe6;color:#1b4d2b;max-width:620px;margin:auto;min-height:100vh}
.hidden{display:none!important}
.top{background:linear-gradient(135deg,#2e7d32,#43a047);color:#fff;padding:14px}
.top h1{font-size:19px;display:flex;align-items:center;gap:8px}
.top .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px}
.top select{padding:5px 8px;border-radius:8px;border:none}
#gpsStatus{background:#ffffff33;padding:4px 10px;border-radius:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px}
.card{background:#fff;border:2px solid #c8e6c9;border-radius:16px;padding:18px 8px;text-align:center;font-weight:600;cursor:pointer;box-shadow:0 2px 6px #0001;transition:.15s}
.card:active{transform:scale(.97);background:#f1f8e9}
.card .ic{font-size:30px;display:block;margin-bottom:6px}
.card.big{grid-column:span 2;background:linear-gradient(135deg,#2e7d32,#388e3c);color:#fff;font-size:20px;padding:28px}
.card.yellow{background:#fff9c4}
.screen{padding:12px}
.screen h3{margin:4px 0 8px}
.back{background:#2e7d32;color:#fff;border:none;padding:9px 16px;border-radius:10px;margin-bottom:10px;font-size:14px}
#map{height:52vh;border-radius:14px;border:2px solid #c8e6c9}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.bar button,.btn{flex:1;min-width:90px;padding:11px 8px;border:none;border-radius:10px;background:#66bb6a;color:#fff;font-weight:600;font-size:14px}
.btn{width:100%;margin:6px 0}
.bar button.red{background:#e53935}
.bar button.blue{background:#1976d2}
.res{background:#fff;border-radius:14px;padding:10px;margin-top:8px;border:2px solid #c8e6c9}
.res div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #ddd}
.res div:last-child{border:none}
.res .v{font-weight:700;font-size:17px;color:#1b5e20}
input,select.f{width:100%;padding:11px;margin:6px 0;border:1px solid #9ccc9c;border-radius:10px;font-size:15px;background:#fff}
.note{font-size:12px;color:#b33;margin-top:10px;line-height:1.5}
.item{background:#fff;border:2px solid #c8e6c9;border-radius:12px;padding:10px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;gap:6px}
.item button{padding:6px 10px;border:none;border-radius:8px;background:#66bb6a;color:#fff}
#acc{margin:6px 0;font-size:14px;font-weight:600}
.pt{background:#e53935;color:#fff;border-radius:50%;width:26px;height:26px;text-align:center;line-height:22px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 4px #0006}
@media print{.back,.bar,button{display:none!important}}
</style>
</head>
<body>

<!-- HOME -->
<div id="home">
  <div class="top">
    <h1>🌾 <span data-t="appname">West Bengal Land Expert</span></h1>
    <div class="row">
      <select id="lang" onchange="setLang()">
        <option value="bn">বাংলা</option><option value="hi">हिन्दी</option><option value="en">English</option>
      </select>
      <span id="gpsStatus">GPS: --</span>
    </div>
  </div>
  <div class="grid">
    <div class="card big" onclick="show('survey')"><span class="ic">📍</span><span data-t="survey">GPS Survey</span></div>
    <div class="card" onclick="show('survey')"><span class="ic">🗺️</span><span data-t="livemap">Live Map</span></div>
    <div class="card" onclick="show('mouza')"><span class="ic">📜</span><span data-t="mouza">Mouza Map</span></div>
    <div class="card" onclick="show('calc')"><span class="ic">🧮</span><span data-t="calc">Land Calculator</span></div>
    <div class="card" onclick="show('conv')"><span class="ic">🔄</span><span data-t="conv">Land Converter</span></div>
    <div class="card" onclick="show('divide')"><span class="ic">✂️</span><span data-t="divide">Land Division</span></div>
    <div class="card" onclick="show('saved')"><span class="ic">💾</span><span data-t="saved">Saved Projects</span></div>
    <div class="card" onclick="show('report')"><span class="ic">📄</span><span data-t="report">Land Report</span></div>
    <div class="card yellow" onclick="show('settings')"><span class="ic">⚙️</span><span data-t="settings">Settings</span></div>
  </div>
</div>

<!-- SURVEY -->
<div id="survey" class="screen hidden">
  <button class="back" onclick="show('home')">← <span data-t="back">Back</span></button>
  <div class="bar">
    <button onclick="startGPS()">📡 <span data-t="gpson">GPS চালু</span></button>
    <button class="blue" onclick="toggleLayer()">🛰️ <span data-t="layer">Satellite / Map</span></button>
  </div>
  <div id="map"></div>
  <div id="acc">Accuracy: --</div>
  <div class="bar">
    <button onclick="addCorner()">➕ <span data-t="addcorner">Add Corner</span></button>
    <button onclick="undo()">↩️ Undo</button>
    <button class="red" onclick="clearAll()">🗑️ <span data-t="delall">Delete All</span></button>
  </div>
  <div class="bar">
    <button onclick="closeShape()">✅ <span data-t="close">Close Boundary</span></button>
    <button onclick="saveProject()">💾 <span data-t="save">Save</span></button>
  </div>
  <div class="note" data-t="gpsnote"></div>
  <div class="res" id="surveyRes"></div>
</div>

<!-- MOUZA -->
<div id="mouza" class="screen hidden">
  <button class="back" onclick="show('home')">← <span data-t="back">Back</span></button>
  <h3 data-t="mouza">Mouza Map</h3>
  <p style="font-size:14px;line-height:1.5" data-t="mouzahelp"></p>
  <input type="file" id="mouzaFile" accept="image/*" onchange="loadMouza(this)">
  <div class="bar">
    <button onclick="mouzaOpacity(-0.1)">− Opacity</button>
    <button onclick="mouzaOpacity(0.1)">+ Opacity</button>
    <button class="blue" onclick="show('survey')">🗺️ <span data-t="livemap">Live Map</span></button>
  </div>
  <div class="note" data-t="mouzanote"></div>
</div>

<!-- CALCULATOR -->
<div id="calc" class="screen hidden">
  <button class="back" onclick="show('home')">← <span data-t="back">Back</span></button>
  <h3 data-t="calc">Land Calculator</h3>
  <input id="cl" type="number" step="any" data-p="length">
  <input id="cw" type="number" step="any" data-p="width">
  <select id="cunit" class="f">
    <option value="ft">ফুট / Feet</option><option value="m">মিটার / Meter</option>
  </select>
  <button class="btn" onclick="calcLW()" data-t="calcbtn"></button>
  <div class="res" id="calcRes"></div>
</div>

<!-- CONVERTER -->
<div id="conv" class="screen hidden">
  <button class="back" onclick="show('home')">← <span data-t="back">Back</span></button>
  <h3 data-t="conv">Land Converter</h3>
  <input id="cv" type="number" step="any" data-p="amount">
  <select id="cu" class="f"></select>
  <button class="btn" onclick="convert()" data-t="convbtn"></button>
  <div class="res" id="convRes"></div>
</div>

<!-- DIVISION -->
<div id="divide" class="screen hidden">
  <button class="back" onclick="show('home')">← <span data-t="back">Back</span></button>
  <h3 data-t="divide">Land Division</h3>
  <input id="da" type="number" step="any" data-p="totalshatak">
  <input id="dn" type="number" step="any" data-p="parts">
  <button class="btn" onclick="divideEq()" data-t="diveq"></button>
  <input id="dp" type="number" step="any" data-p="fixedshatak">
  <button class="btn" onclick="divideFix()" data-t="divfix"></button>
  <div class="res" id="divRes"></div>
</div>

<!-- SAVED -->
<div id="saved" class="screen hidden">
  <button class="back" onclick="show('home')">← <span data-t="back">Back</span></button>
  <h3 data-t="saved">Saved Projects</h3>
  <div id="savedList"></div>
</div>

<!-- REPORT -->
<div id="report" class="screen hidden">
  <button class="back" onclick="show('home')">← <span data-t="back">Back</span></button>
  <h3 data-t="report">Land Report</h3>
  <div class="res" id="reportBody"></div>
  <button class="btn" onclick="window.print()">📄 <span data-t="pdf">PDF Save / Print</span></button>
</div>

<!-- SETTINGS -->
<div id="settings" class="screen hidden">
  <button class="back" onclick="show('home')">← <span data-t="back">Back</span></button>
  <h3 data-t="settings">Settings</h3>
  <label data-t="mainunit"></label>
  <select id="mainUnit" class="f" onchange="saveSettings()">
    <option value="shatak">শতক</option><option value="katha">কাঠা</option><option value="bigha">বিঘা</option><option value="acre">একর</option>
  </select>
  <label data-t="bighatype"></label>
  <select id="bighaType" class="f" onchange="saveSettings()">
    <option value="14400">১ বিঘা = ১৪৪০০ বর্গফুট (২০ কাঠা)</option>
    <option value="17424">১ বিঘা = ১৭৪২৪ বর্গফুট (৪০ শতক)</option>
  </select>
  <div class="note" data-t="unitnote"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ============ TRANSLATIONS ============
const T={
bn:{appname:"West Bengal Land Expert",survey:"GPS Survey",livemap:"Live Map",mouza:"Mouza Map",calc:"Land Calculator",conv:"Land Converter",divide:"Land Division",saved:"Saved Projects",report:"Land Report",settings:"Settings",back:"পিছনে",gpson:"GPS চালু",layer:"স্যাটেলাইট / ম্যাপ",addcorner:"কোণা যোগ",delall:"সব মুছুন",close:"সীমানা বন্ধ",save:"সেভ",
gpsnote:"পয়েন্ট টেনে সঠিক জায়গায় বসানো যাবে। GPS-এ কিছুটা ভুল হতে পারে, তাই Accuracy দেখুন। এই মাপ প্রাথমিক হিসাবের জন্য; সরকারি জমির সীমানা নির্ধারণের বিকল্প নয়।",
mouzahelp:"আপনার মৌজা ম্যাপের ছবি আপলোড করুন। তারপর লাইভ ম্যাপে সেটি স্বচ্ছভাবে বসিয়ে জমির সীমানা মেলাতে পারবেন।",
mouzanote:"ছবিটি ম্যাপের বর্তমান দৃশ্যের ওপর বসবে। Live Map-এ গিয়ে জুম করে মেলান। সরকারি মৌজা ম্যাপের জন্য banglarbhumi.gov.in দেখুন।",
calcbtn:"হিসাব করুন",convbtn:"রূপান্তর",diveq:"সমান ভাগ",divfix:"নির্দিষ্ট পরিমাণ বাদ দিন",pdf:"PDF সেভ / প্রিন্ট",
length:"দৈর্ঘ্য",width:"প্রস্থ",amount:"পরিমাণ",totalshatak:"মোট জমি (শতক)",parts:"কয় ভাগ?",fixedshatak:"নির্দিষ্ট অংশ (শতক)",
mainunit:"প্রধান একক",bighatype:"বিঘার মান",unitnote:"পশ্চিমবঙ্গে সাধারণত ১ বিঘা = ৩৩ শতক (প্রায় ১৪৪০০ বর্গফুট)। এলাকাভেদে মান আলাদা হতে পারে, তাই নিজের এলাকার মান বেছে নিন।",
sqft:"বর্গফুট",sqm:"বর্গমিটার",shatak:"শতক",katha:"কাঠা",bigha:"বিঘা",acre:"একর",perim:"পরিসীমা (মিটার)",points:"পয়েন্ট সংখ্যা",each:"প্রতি ভাগ",given:"নির্দিষ্ট অংশ",rest:"বাকি"},
hi:{appname:"West Bengal Land Expert",survey:"GPS सर्वे",livemap:"लाइव मैप",mouza:"मौजा मैप",calc:"भूमि कैलकुलेटर",conv:"भूमि कन्वर्टर",divide:"भूमि विभाजन",saved:"सेव प्रोजेक्ट",report:"भूमि रिपोर्ट",settings:"सेटिंग्स",back:"वापस",gpson:"GPS चालू",layer:"सैटेलाइट / मैप",addcorner:"कोना जोड़ें",delall:"सब हटाएं",close:"सीमा बंद करें",save:"सेव",
gpsnote:"पॉइंट को खींचकर सही जगह रखा जा सकता है। GPS में थोड़ी गलती हो सकती है, इसलिए Accuracy देखें। यह माप केवल प्रारंभिक हिसाब के लिए है; सरकारी सीमा निर्धारण का विकल्प नहीं।",
mouzahelp:"अपने मौजा मैप की फोटो अपलोड करें। फिर लाइव मैप पर उसे पारदर्शी रूप से रखकर सीमा मिलाएं।",
mouzanote:"फोटो मैप के वर्तमान दृश्य पर बैठेगी। Live Map में जाकर ज़ूम करके मिलाएं।",
calcbtn:"हिसाब करें",convbtn:"बदलें",diveq:"बराबर भाग",divfix:"निर्दिष्ट मात्रा घटाएं",pdf:"PDF सेव / प्रिंट",
length:"लंबाई",width:"चौड़ाई",amount:"मात्रा",totalshatak:"कुल जमीन (शतक)",parts:"कितने भाग?",fixedshatak:"निर्दिष्ट हिस्सा (शतक)",
mainunit:"मुख्य इकाई",bighatype:"बीघा का मान",unitnote:"पश्चिम बंगाल में आमतौर पर 1 बीघा = 33 शतक (लगभग 14400 वर्गफुट)। इलाके के अनुसार मान अलग हो सकता है।",
sqft:"वर्गफुट",sqm:"वर्गमीटर",shatak:"शतक",katha:"काठा",bigha:"बीघा",acre:"एकड़",perim:"परिमाप (मीटर)",points:"पॉइंट संख्या",each:"प्रति भाग",given:"निर्दिष्ट हिस्सा",rest:"बाकी"},
en:{appname:"West Bengal Land Expert",survey:"GPS Survey",livemap:"Live Map",mouza:"Mouza Map",calc:"Land Calculator",conv:"Land Converter",divide:"Land Division",saved:"Saved Projects",report:"Land Report",settings:"Settings",back:"Back",gpson:"Start GPS",layer:"Satellite / Map",addcorner:"Add Corner",delall:"Delete All",close:"Close Boundary",save:"Save",
gpsnote:"Drag points to correct them. GPS can be off by a few metres, so watch the accuracy. This is a preliminary estimate and not a substitute for an official boundary survey.",
mouzahelp:"Upload a photo of your mouza map, then overlay it semi-transparently on the live map to compare boundaries.",
mouzanote:"The image is placed over the current map view. Go to Live Map and zoom to align it.",
calcbtn:"Calculate",convbtn:"Convert",diveq:"Divide equally",divfix:"Subtract fixed portion",pdf:"Save PDF / Print",
length:"Length",width:"Width",amount:"Amount",totalshatak:"Total land (shatak)",parts:"Number of parts",fixedshatak:"Fixed portion (shatak)",
mainunit:"Main unit",bighatype:"Bigha value",unitnote:"In West Bengal 1 bigha is commonly 33 shatak (about 14400 sq ft). Values vary by area, so pick the one for yours.",
sqft:"Sq ft",sqm:"Sq m",shatak:"Shatak",katha:"Katha",bigha:"Bigha",acre:"Acre",perim:"Perimeter (m)",points:"Points",each:"Each part",given:"Fixed portion",rest:"Remaining"}
};
let LANG=localStorage.getItem('lang')||'bn';
const tr=k=>(T[LANG]&&T[LANG][k])||T.en[k]||k;
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=tr(e.dataset.t)});
  document.querySelectorAll('[data-p]').forEach(e=>{e.placeholder=tr(e.dataset.p)});
  fillConverter();
  document.getElementById('lang').value=LANG;
}
function setLang(){LANG=document.getElementById('lang').value;localStorage.setItem('lang',LANG);applyLang();}

// ============ UNITS (base: sq ft) ============
function bighaSqft(){return +(localStorage.getItem('bighaSqft')||14400);}
function unitSqft(k){
  switch(k){
    case 'shatak':return 435.6;
    case 'katha':return 720;
    case 'bigha':return bighaSqft();
    case 'acre':return 43560;
    case 'sqft':return 1;
    case 'sqm':return 10.7639;
  }
}
const UNIT_KEYS=['shatak','katha','bigha','acre','sqft','sqm'];
function resultsHTML(sqft,perimeterM){
  let h='';
  UNIT_KEYS.forEach(k=>{h+=`<div><span>${tr(k)}</span><span class="v">${(sqft/unitSqft(k)).toFixed(3)}</span></div>`});
  if(perimeterM!=null)h+=`<div><span>${tr('perim')}</span><span class="v">${perimeterM.toFixed(2)}</span></div>`;
  return h;
}

// ============ NAVIGATION ============
function show(id){
  document.querySelectorAll('#home,.screen').forEach(e=>e.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  if(id==='survey')setTimeout(initMap,80);
  if(id==='saved')renderSaved();
  if(id==='report')renderReport();
  window.scrollTo(0,0);
}

// ============ CALCULATOR / CONVERTER / DIVISION ============
function calcLW(){
  let l=+document.getElementById('cl').value,w=+document.getElementById('cw').value;
  if(!l||!w)return;
  if(document.getElementById('cunit').value==='m'){l*=3.28084;w*=3.28084;}
  document.getElementById('calcRes').innerHTML=resultsHTML(l*w,2*(l+w)*0.3048);
}
function fillConverter(){
  const s=document.getElementById('cu'),cur=s.value;
  s.innerHTML='';
  UNIT_KEYS.forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=tr(k);s.appendChild(o)});
  if(cur)s.value=cur;
}
function convert(){
  const v=+document.getElementById('cv').value,u=document.getElementById('cu').value;
  if(!v)return;
  document.getElementById('convRes').innerHTML=resultsHTML(v*unitSqft(u),null);
}
function divideEq(){
  const a=+document.getElementById('da').value,n=+document.getElementById('dn').value;
  if(!a||!n)return;
  document.getElementById('divRes').innerHTML=`<div><span>${tr('each')}</span><span class="v">${(a/n).toFixed(3)} ${tr('shatak')}</span></div>`;
}
function divideFix(){
  const a=+document.getElementById('da').value,p=+document.getElementById('dp').value;
  if(!a||!p)return;
  document.getElementById('divRes').innerHTML=`<div><span>${tr('given')}</span><span class="v">${p} ${tr('shatak')}</span></div><div><span>${tr('rest')}</span><span class="v">${(a-p).toFixed(3)} ${tr('shatak')}</span></div>`;
}

// ============ MAP & GPS ============
let map,osm,sat,useSat=false,myMarker,accCircle,watchId=null,curPos=null,curAcc=null;
let points=[],markers=[],poly=null,closed=false,mouzaOverlay=null,mouzaOp=0.6,mouzaURL=null;

function initMap(){
  if(map){map.invalidateSize();return;}
  map=L.map('map').setView([22.9868,87.855],8);
  osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
  sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri'});
  osm.addTo(map);
  if(mouzaURL)placeMouza();
}
function toggleLayer(){
  if(!map)return;
  useSat=!useSat;
  if(useSat){map.removeLayer(osm);sat.addTo(map);}else{map.removeLayer(sat);osm.addTo(map);}
}
function startGPS(){
  if(!navigator.geolocation){alert('GPS not supported');return;}
  if(watchId!==null)return;
  watchId=navigator.geolocation.watchPosition(p=>{
    curPos=[p.coords.latitude,p.coords.longitude];curAcc=p.coords.accuracy;
    document.getElementById('gpsStatus').textContent='GPS: ON';
    document.getElementById('acc').textContent='Accuracy: ±'+curAcc.toFixed(1)+' m';
    if(!myMarker){
      myMarker=L.circleMarker(curPos,{radius:9,color:'#fff',weight:3,fillColor:'#1976d2',fillOpacity:1}).addTo(map);
      accCircle=L.circle(curPos,{radius:curAcc,color:'#1976d2',weight:1,fillOpacity:0.1}).addTo(map);
      map.setView(curPos,19);
    }else{myMarker.setLatLng(curPos);accCircle.setLatLng(curPos).setRadius(curAcc);}
  },e=>{
    document.getElementById('gpsStatus').textContent='GPS: OFF';
    alert('GPS error: '+e.message);watchId=null;
  },{enableHighAccuracy:true,maximumAge:0,timeout:20000});
}
function addCorner(){
  if(!curPos){alert('Start GPS first / আগে GPS চালু করুন');return;}
  if(closed){alert('Boundary already closed');return;}
  points.push({ll:[...curPos],acc:curAcc});
  redraw();
}
function undo(){if(closed)closed=false;else points.pop();redraw();}
function clearAll(){if(confirm('Delete all points?')){points=[];closed=false;redraw();}}
function closeShape(){
  if(points.length<3){alert('Minimum 3 corners');return;}
  closed=true;redraw();
}
function redraw(){
  if(!map)return;
  markers.forEach(m=>map.removeLayer(m));markers=[];
  if(poly){map.removeLayer(poly);poly=null;}
  points.forEach((p,i)=>{
    const m=L.marker(p.ll,{draggable:true,icon:L.divIcon({className:'',html:`<div class="pt">${i+1}</div>`,iconSize:[26,26],iconAnchor:[13,13]})}).addTo(map);
    m.on('drag',()=>{points[i].ll=[m.getLatLng().lat,m.getLatLng().lng];updatePoly();showSurveyResult();});
    m.on('dragend',()=>{points[i].acc=null;redraw();});
    markers.push(m);
  });
  updatePoly();
  showSurveyResult();
}
function updatePoly(){
  if(poly){map.removeLayer(poly);poly=null;}
  const lls=points.map(p=>p.ll);
  if(lls.length>=2){
    poly=closed?L.polygon(lls,{color:'#2e7d32',weight:3,fillColor:'#66bb6a',fillOpacity:0.4}):L.polyline(lls,{color:'#2e7d32',weight:3});
    poly.addTo(map);
  }
}
// local projection + shoelace
function areaPerim(lls){
  const R=6371008.8,lat0=lls.reduce((s,p)=>s+p[0],0)/lls.length*Math.PI/180;
  const xy=lls.map(p=>[R*(p[1]*Math.PI/180)*Math.cos(lat0),R*(p[0]*Math.PI/180)]);
  let a=0,per=0;
  for(let i=0;i<xy.length;i++){
    const j=(i+1)%xy.length;
    a+=xy[i][0]*xy[j][1]-xy[j][0]*xy[i][1];
    per+=Math.hypot(xy[j][0]-xy[i][0],xy[j][1]-xy[i][1]);
  }
  return{sqm:Math.abs(a)/2,per};
}
function showSurveyResult(){
  const box=document.getElementById('surveyRes');
  let html=`<div><span>${tr('points')}</span><span class="v">${points.length}</span></div>`;
  if(points.length>=3){const r=areaPerim(points.map(p=>p.ll));html+=resultsHTML(r.sqm*10.7639,r.per);}
  box.innerHTML=html;
}

// ============ MOUZA OVERLAY ============
function loadMouza(inp){
  const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=e=>{mouzaURL=e.target.result;show('survey');setTimeout(()=>{initMap();placeMouza();},150);};
  rd.readAsDataURL(f);
}
function placeMouza(){
  if(!map||!mouzaURL)return;
  if(mouzaOverlay)map.removeLayer(mouzaOverlay);
  mouzaOverlay=L.imageOverlay(mouzaURL,map.getBounds().pad(-0.15),{opacity:mouzaOp}).addTo(map);
}
function mouzaOpacity(d){
  mouzaOp=Math.min(1,Math.max(0.1,mouzaOp+d));
  if(mouzaOverlay)mouzaOverlay.setOpacity(mouzaOp);
}

// ============ SAVE / LOAD ============
function getSaved(){return JSON.parse(localStorage.getItem('wbleProjects')||'[]');}
function saveProject(){
  if(points.length<3){alert('Minimum 3 points');return;}
  const name=prompt('Name / নাম:','জমি '+(getSaved().length+1));if(!name)return;
  const r=areaPerim(points.map(p=>p.ll));
  const list=getSaved();
  list.push({name,date:new Date().toLocaleString(),points,sqm:r.sqm,per:r.per});
  localStorage.setItem('wbleProjects',JSON.stringify(list));
  alert('Saved ✔');
}
function renderSaved(){
  const list=getSaved(),box=document.getElementById('savedList');
  if(!list.length){box.innerHTML='<p>—</p>';return;}
  box.innerHTML=list.map((p,i)=>`<div class="item"><div><b>${p.name}</b><br><small>${p.date} • ${(p.sqm*10.7639/435.6).toFixed(2)} ${tr('shatak')}</small></div><div><button onclick="loadProject(${i})">▶</button> <button style="background:#e53935" onclick="delProject(${i})">✕</button></div></div>`).join('');
}
function loadProject(i){
  const p=getSaved()[i];points=p.points;closed=true;show('survey');
  setTimeout(()=>{initMap();redraw();map.fitBounds(points.map(x=>x.ll));},250);
}
function delProject(i){const l=getSaved();l.splice(i,1);localStorage.setItem('wbleProjects',JSON.stringify(l));renderSaved();}

// ============ REPORT ============
function renderReport(){
  const b=document.getElementById('reportBody');
  if(points.length<3){b.innerHTML='<p>GPS Survey → Add Corner ×3+</p>';return;}
  const r=areaPerim(points.map(p=>p.ll));
  let h='<h4>'+tr('report')+' – '+new Date().toLocaleString()+'</h4>'+resultsHTML(r.sqm*10.7639,r.per);
  h+='<h4 style="margin-top:8px">Corners (Lat, Lng)</h4>';
  points.forEach((p,i)=>{h+=`<div><span>#${i+1}</span><span>${p.ll[0].toFixed(6)}, ${p.ll[1].toFixed(6)} (±${p.acc?p.acc.toFixed(1):'-'} m)</span></div>`});
  h+='<p class="note">'+tr('gpsnote')+'</p>';
  b.innerHTML=h;
}

// ============ SETTINGS ============
function saveSettings(){
  localStorage.setItem('mainUnit',document.getElementById('mainUnit').value);
  localStorage.setItem('bighaSqft',document.getElementById('bighaType').value);
}
document.getElementById('mainUnit').value=localStorage.getItem('mainUnit')||'shatak';
document.getElementById('bighaType').value=localStorage.getItem('bighaSqft')||'14400';
applyLang();
</script>
