<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B7A3E">
<meta name="description" content="পশ্চিমবঙ্গ জমি এক্সপার্ট — শতক, কাঠা, বিঘা কনভার্টার, জমি মাপা, জমি ভাগ, GPS সার্ভে, ম্যাপ ও রিপোর্ট।">
<title>পশ্চিমবঙ্গ জমি এক্সপার্ট | West Bengal Land Expert</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--g:#1B7A3E;--gd:#12582b;--y:#F2B705;--r:#C62828;--bg:#FFFBF2;--tint:#E9F5EC;--tx:#1A2A1F;--mu:#5b6b60;--bd:#cfe2d3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Noto Sans Bengali","Hind Siliguri","Noto Sans Devanagari",system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.45;padding-bottom:84px}
button{font-family:inherit;cursor:pointer}
.view{display:none;max-width:640px;margin:0 auto}
.view.active{display:block}
.pad{padding:12px 14px}
/* home */
.hhead{display:flex;align-items:center;gap:10px;padding:12px 14px 6px}
.logo{width:56px;height:56px;border-radius:50%;background:#fff;border:3px solid var(--y);display:flex;align-items:center;justify-content:center;flex:none}
.logo svg{width:34px;height:40px}
.hhead h1{margin:0;font-size:19px;line-height:1.2;color:var(--gd)}
.hhead p{margin:2px 0 0;font-size:12.5px;color:var(--mu);font-style:italic}
.langs{margin-left:auto;display:flex;flex-direction:column;gap:4px}
.langs button{border:1px solid var(--g);background:#fff;color:var(--g);border-radius:999px;font-size:12px;padding:3px 10px}
.langs button.on{background:var(--g);color:#fff}
.banner{margin:8px 14px;border-radius:22px;padding:18px;color:#fff;background:linear-gradient(120deg,#1B7A3E 0%,#2e9a52 55%,#7cc06a 100%);display:flex;align-items:center;gap:8px;overflow:hidden;position:relative;min-height:170px}
.banner:after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:linear-gradient(90deg,var(--y),#fff0,var(--r))}
.banner .w{font-size:20px;font-weight:600}
.banner .big{font-size:25px;font-weight:800;color:var(--y);line-height:1.15;margin:2px 0 6px}
.banner .sol{font-size:13px;opacity:.95}
.pill{margin-top:12px;background:#fff;color:var(--g);border:0;border-radius:999px;padding:9px 16px;font-weight:700;font-size:15px}
.banner svg{width:96px;height:120px;flex:none;margin-left:auto;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
.sectitle{display:flex;align-items:center;gap:10px;margin:16px 14px 10px;color:var(--g)}
.sectitle:before,.sectitle:after{content:"";flex:1;height:2px;background:var(--g);opacity:.5}
.sectitle span{background:var(--g);color:#fff;font-weight:700;padding:7px 18px;border-radius:999px;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px}
.tcard{display:flex;align-items:center;gap:8px;text-align:left;background:var(--tint);border:1.5px solid #bfe0c8;border-radius:16px;padding:12px 10px;color:var(--tx);min-height:76px}
.tcard i{font-style:normal;font-size:30px;flex:none}
.tcard b{display:block;font-size:14.5px;line-height:1.2}
.tcard small{display:block;color:var(--mu);font-size:11.5px;line-height:1.25;margin-top:2px}
.tcard .chev{margin-left:auto;background:var(--g);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.explore{margin:12px 14px;display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#e8f6e6,#f6fbe9);border:1.5px solid #bfe0c8;border-radius:16px;padding:14px;width:calc(100% - 28px);text-align:left}
.explore i{font-style:normal;font-size:30px}
.explore b{display:block;font-size:16px}
.explore small{color:var(--mu);font-size:12px}
.explore .go{margin-left:auto;background:var(--g);color:#fff;border-radius:999px;padding:8px 16px;font-weight:700}
.wave{height:6px;margin:14px 14px 0;border-radius:3px;background:linear-gradient(90deg,var(--g),var(--y),var(--r))}
/* sub pages */
.topbar{display:flex;align-items:center;gap:10px;background:var(--g);color:#fff;padding:12px 14px;position:sticky;top:0;z-index:1000}
.topbar button{background:rgba(255,255,255,.18);border:0;color:#fff;width:36px;height:36px;border-radius:50%;font-size:20px}
.topbar h2{margin:0;font-size:18px}
.card{background:#fff;border:1px solid #e3eadf;border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card h3{margin:0 0 6px;font-size:16px;color:var(--g)}
.hint{font-size:13px;color:var(--mu);margin:4px 0 8px}
.warn{background:#fff8e1;border-left:4px solid var(--y);padding:8px 10px;border-radius:6px;font-size:13px;margin:8px 0}
.disc{background:#fdecea;border-left:4px solid var(--r);padding:8px 10px;border-radius:6px;font-size:12.5px;margin:10px 0}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button{flex:1;border:1.5px solid var(--g);background:#fff;color:var(--g);padding:9px 4px;border-radius:10px;font-weight:700;font-size:14px}
.tabs button.on{background:var(--g);color:#fff}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}
.row label{flex:0 0 40%;font-weight:600;font-size:14.5px}
.row input,.row select,select.f,input.f,textarea.f{flex:1;min-width:0;font-size:17px;padding:10px 12px;border:2px solid var(--bd);border-radius:10px;background:var(--tint);font-family:inherit;color:var(--tx);width:100%}
select.f,input.f,textarea.f{margin:4px 0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--g);background:#fff}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.btn{border:0;background:var(--g);color:#fff;padding:11px 16px;border-radius:12px;font-weight:700;font-size:15px}
.btn.y{background:var(--y);color:#222}
.btn.o{background:#fff;color:var(--g);border:1.5px solid var(--g)}
.btn.r{background:#fff;color:var(--r);border:1.5px solid var(--r)}
.btn.s{padding:7px 12px;font-size:13px}
.btn.on{background:var(--y);color:#222}
.btn:disabled{opacity:.5}
.big-res{font-size:22px;font-weight:800;color:var(--gd);background:#fff8e1;border:2px solid var(--y);border-radius:12px;padding:10px 12px;margin:8px 0;text-align:center}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.res-grid div{background:var(--tint);border-radius:10px;padding:7px 10px;display:flex;justify-content:space-between;gap:6px;font-size:14px}
.res-grid span{color:var(--mu)}
canvas.cv{width:100%;height:55vh;min-height:300px;background:#fff;border:2px solid var(--bd);border-radius:12px;touch-action:none;display:block}
#map{height:60vh;min-height:320px;border-radius:12px;border:2px solid var(--bd);position:relative;z-index:0}
.ptm{background:var(--y);border:2px solid var(--g);border-radius:50%}
.list .it{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed #dde6da;font-size:14px}
.list .it:last-child{border:0}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.bar{display:flex;height:34px;border-radius:8px;overflow:hidden;margin:8px 0}
.bar div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}
.pro{background:#fff;border:1px solid #e3eadf;border-radius:14px;padding:12px;margin:10px 0}
.pro b{font-size:16px}
.pro small{display:block;color:var(--mu)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dgrid button{background:var(--tint);border:1.5px solid #bfe0c8;border-radius:12px;padding:12px;font-size:15px;color:var(--tx);text-align:left}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dfe7dc;display:flex;z-index:1001;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 0 6px;font-size:12px;color:var(--mu)}
nav button i{display:block;font-style:normal;font-size:22px}
nav button.on{color:var(--g);font-weight:800}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:2000;max-width:90%;text-align:center}
#toast.on{opacity:.95}
/* report paper */
#reportPaper{background:#fff;border:1px solid #bbb;padding:18px;margin-top:10px;font-size:14px}
#reportPaper h1{font-size:20px;margin:0 0 2px;color:var(--gd)}
#reportPaper table{width:100%;border-collapse:collapse;margin:10px 0}
#reportPaper td,#reportPaper th{border:1px solid #999;padding:6px 8px;text-align:left;font-size:13.5px}
#reportPaper .sig{display:flex;justify-content:space-between;margin-top:46px;font-size:13px}
#reportPaper .sig div{border-top:1px solid #333;padding-top:4px;width:44%;text-align:center}
@media print{
  body{padding:0;background:#fff}
  body *{visibility:hidden}
  #reportPaper,#reportPaper *{visibility:visible}
  #reportPaper{position:absolute;left:0;top:0;width:100%;border:0;margin:0}
}
</style>
</head>
<body>
<div id="toast"></div>

<!-- ============ HOME ============ -->
<section class="view active" id="v-home">
  <div class="hhead">
    <div class="logo"><svg viewBox="0 0 100 130"><path d="M48 4 L58 8 L66 6 L68 16 L60 22 L54 30 L56 40 L52 50 L58 58 L54 66 L46 70 L42 62 L36 58 L32 66 L34 76 L30 86 L24 94 L30 104 L38 110 L44 120 L54 126 L66 124 L78 118 L82 110 L74 104 L78 94 L72 86 L76 78 L68 70 L72 60 L66 52 L70 42 L64 34 L70 24 L64 14 Z" fill="#1B7A3E" stroke="#F2B705" stroke-width="4" stroke-linejoin="round"/></svg></div>
    <div><h1 data-t="app"></h1><p data-t="tag"></p></div>
    <div class="langs"><button data-l="0">বাংলা</button><button data-l="1">हिन्दी</button><button data-l="2">English</button></div>
  </div>
  <div class="banner">
    <div>
      <div class="w" data-t="welcome"></div>
      <div class="big" data-t="app"></div>
      <div class="sol" data-t="solution"></div>
      <button class="pill" onclick="openWB()"><span data-t="wbmap"></span> ›</button>
    </div>
    <svg viewBox="0 0 100 130"><path d="M48 4 L58 8 L66 6 L68 16 L60 22 L54 30 L56 40 L52 50 L58 58 L54 66 L46 70 L42 62 L36 58 L32 66 L34 76 L30 86 L24 94 L30 104 L38 110 L44 120 L54 126 L66 124 L78 118 L82 110 L74 104 L78 94 L72 86 L76 78 L68 70 L72 60 L66 52 L70 42 L64 34 L70 24 L64 14 Z" fill="#F2B705" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><circle cx="52" cy="72" r="5" fill="#1B7A3E"/></svg>
  </div>
  <div class="sectitle"><span>🛠 <span data-t="tools"></span></span></div>
  <div class="grid">
    <button class="tcard" onclick="go('mouza')"><i>🗺️</i><div><b data-t="mouza"></b><small data-t="mouza_d"></small></div><span class="chev">›</span></button>
    <button class="tcard" onclick="go('gps')"><i>📡</i><div><b data-t="gps"></b><small data-t="gps_d"></small></div><span class="chev">›</span></button>
    <button class="tcard" onclick="go('calc')"><i>🧮</i><div><b data-t="calc"></b><small data-t="calc_d"></small></div><span class="chev">›</span></button>
    <button class="tcard" onclick="go('divide')"><i>✂️</i><div><b data-t="divide"></b><small data-t="divide_d"></small></div><span class="chev">›</span></button>
    <button class="tcard" onclick="go('cad')"><i>📐</i><div><b data-t="cad"></b><small data-t="cad_d"></small></div><span class="chev">›</span></button>
    <button class="tcard" onclick="go('report')"><i>📄</i><div><b data-t="report"></b><small data-t="report_d"></small></div><span class="chev">›</span></button>
    <button class="tcard" onclick="go('layers')"><i>🛰️</i><div><b data-t="layers"></b><small data-t="layers_d"></small></div><span class="chev">›</span></button>
    <button class="tcard" onclick="go('projects')"><i>📁</i><div><b data-t="projects"></b><small data-t="projects_d"></small></div><span class="chev">›</span></button>
  </div>
  <button class="explore" onclick="go('districts')"><i>📍</i><div><b data-t="explore"></b><small data-t="explore_d"></small></div><span class="go">›</span></button>
  <div class="wave"></div>
</section>

<!-- ============ CALC ============ -->
<section class="view" id="v-calc">
  <div class="topbar"><button onclick="go('home')">←</button><h2 data-t="calc"></h2></div>
  <div class="pad">
    <div class="tabs"><button id="ct1" class="on" onclick="calcTab(1)" data-t="tab_conv"></button><button id="ct2" onclick="calcTab(2)" data-t="tab_area"></button></div>
    <div id="calcA" class="card">
      <h3 data-t="tab_conv"></h3>
      <p class="hint" data-t="conv_sub"></p>
      <div id="cvRows"></div>
      <div class="btns"><button class="btn o s" onclick="convClear()" data-t="clear"></button></div>
      <div class="warn" id="cvRates"></div>
    </div>
    <div id="calcB" class="card" style="display:none">
      <h3 data-t="tab_area"></h3>
      <select id="cShape" class="f"></select>
      <div class="row"><label data-t="lenunit"></label><select id="cLen"><option value="ft" data-t="u_ft"></option><option value="m" data-t="u_m"></option><option value="hat" data-t="u_hat"></option></select></div>
      <div id="cFields"></div>
      <div id="cRes"></div>
      <div class="btns"><button class="btn" onclick="calcSave()" data-t="save"></button><button class="btn y" onclick="toReport()" data-t="rep_btn"></button><button class="btn o" onclick="toDivide()" data-t="div_btn"></button></div>
    </div>
  </div>
</section>

<!-- ============ DIVIDE ============ -->
<section class="view" id="v-divide">
  <div class="topbar"><button onclick="go('home')">←</button><h2 data-t="divide"></h2></div>
  <div class="pad">
    <div class="tabs"><button id="dt1" class="on" onclick="dvTab(1)" data-t="d_tab1"></button><button id="dt2" onclick="dvTab(2)" data-t="d_tab2"></button></div>
    <div class="card">
      <div id="dvSrcBox1">
        <div class="row"><label data-t="d_total"></label><input id="dvTotal" inputmode="decimal" placeholder="0"><select id="dvUnit" style="flex:0 0 38%"><option value="shatak" data-t="shatak"></option><option value="katha" data-t="katha"></option><option value="bigha" data-t="bigha"></option><option value="acre" data-t="acre"></option><option value="sqft" data-t="sqft"></option></select></div>
      </div>
      <div id="dvSrcBox2" style="display:none">
        <label class="hint" data-t="d_src"></label>
        <select id="dvSrc" class="f"></select>
      </div>
      <select id="dvMode" class="f"><option value="equal" data-t="d_equal"></option><option value="pct" data-t="d_pct"></option><option value="cut" data-t="d_cut"></option></select>
      <div id="dvEq" class="row"><label data-t="d_n"></label><input id="dvN" inputmode="numeric" value="2"></div>
      <div id="dvPc" style="display:none"><label class="hint" data-t="d_pcts"></label><input id="dvPct" class="f" value="40,30,30"></div>
      <div id="dvCt" style="display:none" class="row"><label data-t="d_cutamt"></label><input id="dvCut" inputmode="decimal" placeholder="0"><select id="dvCutU" style="flex:0 0 38%"><option value="shatak" data-t="shatak"></option><option value="katha" data-t="katha"></option><option value="bigha" data-t="bigha"></option><option value="acre" data-t="acre"></option><option value="sqft" data-t="sqft"></option></select></div>
      <div id="dvAng" style="display:none"><label class="hint"><span data-t="d_angle"></span>: <b id="dvAngV">0</b>°</label><input id="dvAngle" type="range" min="0" max="179" value="0" style="width:100%"></div>
    </div>
    <div id="dvShapeBox" style="display:none"><canvas id="dvCanvas" class="cv" style="height:42vh;min-height:240px"></canvas></div>
    <div class="card"><div id="dvBar"></div><div id="dvOut" class="list"></div></div>
    <div class="disc" data-t="disc"></div>
  </div>
</section>

<!-- ============ GPS ============ -->
<section class="view" id="v-gps">
  <div class="topbar"><button onclick="go('home')">←</button><h2 data-t="gps"></h2></div>
  <div class="pad">
    <div class="card">
      <p class="hint" data-t="g_hint"></p>
      <div id="gStatus" class="warn"></div>
      <div class="btns"><button class="btn" id="gStartBtn" onclick="gStart()" data-t="g_start"></button><button class="btn y" id="gAddBtn" onclick="gAdd()" data-t="g_add"></button><button class="btn o" onclick="gUndo()" data-t="undo"></button><button class="btn r" onclick="gClear()" data-t="clear"></button></div>
    </div>
    <canvas id="gCanvas" class="cv" style="height:40vh;min-height:240px"></canvas>
    <div class="card"><div id="gRes"></div><div id="gList" class="list"></div>
      <div class="btns"><button class="btn" onclick="gSave()" data-t="save"></button><button class="btn y" onclick="toReport()" data-t="rep_btn"></button><button class="btn o" onclick="toDivide()" data-t="div_btn"></button></div>
    </div>
    <div class="disc" data-t="disc"></div>
  </div>
</section>

<!-- ============ MOUZA ============ -->
<section class="view" id="v-mouza">
  <div class="topbar"><button onclick="go('home')">←</button><h2 data-t="mouza"></h2></div>
  <div class="pad">
    <div class="card">
      <div class="btns">
        <label class="btn y" style="display:inline-block">📷 <span data-t="m_up"></span><input id="mFile" type="file" accept="image/*" style="display:none"></label>
        <button class="btn o" id="mbCal" onclick="mMode('calib')" data-t="m_calib"></button>
        <button class="btn o" id="mbTr" onclick="mMode('trace')" data-t="m_trace"></button>
      </div>
      <div class="warn" id="mStep"></div>
      <div id="mCalForm" style="display:none">
        <div class="row"><label data-t="m_dist"></label><input id="mDist" inputmode="decimal" placeholder="0"><select id="mUnit" style="flex:0 0 40%"><option value="ft" data-t="u_ft"></option><option value="m" data-t="u_m"></option><option value="chain" data-t="u_chain"></option><option value="hat" data-t="u_hat"></option></select></div>
        <div class="btns"><button class="btn" onclick="mSetScale()" data-t="m_set"></button></div>
      </div>
    </div>
    <canvas id="mCanvas" class="cv"></canvas>
    <div class="btns"><button class="btn o s" onclick="mZoom(1.3)">＋</button><button class="btn o s" onclick="mZoom(1/1.3)">－</button><button class="btn o s" onclick="mFit()" data-t="fit"></button><button class="btn o" onclick="mUndo()" data-t="undo"></button><button class="btn r" onclick="mClear()" data-t="clear"></button></div>
    <div class="card"><div id="mRes"></div>
      <div class="btns"><button class="btn" onclick="mSave()" data-t="save"></button><button class="btn y" onclick="toReport()" data-t="rep_btn"></button><button class="btn o" onclick="toDivide()" data-t="div_btn"></button></div>
    </div>
    <div class="disc" data-t="disc"></div>
  </div>
</section>

<!-- ============ CAD ============ -->
<section class="view" id="v-cad">
  <div class="topbar"><button onclick="go('home')">←</button><h2 data-t="cad"></h2></div>
  <div class="pad">
    <div class="btns" id="cTools">
      <button class="btn o s on" data-c="line" data-t="c_line"></button>
      <button class="btn o s" data-c="poly" data-t="c_poly"></button>
      <button class="btn o s" data-c="rect" data-t="c_rect"></button>
      <button class="btn o s" data-c="circ" data-t="c_circ"></button>
      <button class="btn o s" data-c="text" data-t="c_text"></button>
    </div>
    <div class="row" style="margin:4px 0"><label style="flex:0 0 34%"><span data-t="c_grid"></span></label><input id="cGrid" inputmode="decimal" value="5" style="flex:0 0 22%"><label style="flex:1;font-weight:400"><input type="checkbox" id="cSnap" checked style="width:auto"> <span data-t="c_snap"></span></label></div>
    <div class="warn" id="cStep"></div>
    <canvas id="cCanvas" class="cv"></canvas>
    <div class="btns"><button class="btn o s" onclick="cZoom(1.3)">＋</button><button class="btn o s" onclick="cZoom(1/1.3)">－</button><button class="btn y s" onclick="cFinish()" data-t="c_finish"></button><button class="btn o" onclick="cUndo()" data-t="undo"></button><button class="btn r" onclick="cClear()" data-t="clear"></button></div>
    <div class="card"><div id="cRes2"></div>
      <div class="btns"><button class="btn" onclick="cSave()" data-t="save"></button><button class="btn o" onclick="cPNG()" data-t="c_png"></button><button class="btn o" onclick="cDXF()">DXF</button><button class="btn y" onclick="toReport()" data-t="rep_btn"></button></div>
    </div>
  </div>
</section>

<!-- ============ REPORT ============ -->
<section class="view" id="v-report">
  <div class="topbar"><button onclick="go('home')">←</button><h2 data-t="report"></h2></div>
  <div class="pad">
    <div class="card">

/* ======================================================================

   ====================================================================== */
//#GEO-START
function polyArea(p){let a=0;for(let i=0;i<p.length;i++){const j=(i+1)%p.length;a+=p[i][0]*p[j][1]-p[j][0]*p[i][1];}return Math.abs(a)/2;}
function polyPerim(p){let s=0;for(let i=0;i<p.length;i++){const j=(i+1)%p.length;s+=Math.hypot(p[j][0]-p[i][0],p[j][1]-p[i][1]);}return s;}
function clipHalf(poly,nx,ny,d,keepLess){
  const out=[];const f=p=>(p[0]*nx+p[1]*ny-d)*(keepLess?-1:1);
  for(let i=0;i<poly.length;i++){
    const a=poly[i],b=poly[(i+1)%poly.length],fa=f(a),fb=f(b);
    if(fa>=0)out.push(a);
    if((fa>=0)!==(fb>=0)){const k=fa/(fa-fb);out.push([a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k]);}
  }
  return out;
}
function areaBelow(poly,nx,ny,d){const c=clipHalf(poly,nx,ny,d,true);return c.length<3?0:polyArea(c);}
function divideByFractions(poly,fr,angDeg){
  const th=angDeg*Math.PI/180,nx=Math.cos(th),ny=Math.sin(th);
  const proj=poly.map(p=>p[0]*nx+p[1]*ny);
  const lo=Math.min(...proj),hi=Math.max(...proj);
  const A=polyArea(poly);const cuts=[lo];let acc=0;
  for(let i=0;i<fr.length-1;i++){
    acc+=fr[i];const target=A*acc;let l=lo,h=hi;
    for(let k=0;k<60;k++){const m=(l+h)/2;if(areaBelow(poly,nx,ny,m)<target)l=m;else h=m;}
    cuts.push((l+h)/2);
  }
  cuts.push(hi);
  const parts=[];
  for(let i=0;i<fr.length;i++){
    let q=clipHalf(poly,nx,ny,cuts[i],false);q=clipHalf(q,nx,ny,cuts[i+1],true);
    parts.push({poly:q,area:q.length<3?0:polyArea(q)});
  }
  return {parts,cuts,nx,ny};
}
function toXY(pts){
  const la0=pts[0].lat*Math.PI/180,kx=111320*Math.cos(la0),ky=110574;
  return pts.map(p=>[(p.lon-pts[0].lon)*kx,(p.lat-pts[0].lat)*ky]);
}
function heron(a,b,c){const s=(a+b+c)/2,v=s*(s-a)*(s-b)*(s-c);return v>0?Math.sqrt(v):NaN;}

/* ---------- number formatting ---------- */
const BN='০১২৩৪৫৬৭৮৯';
function nf(n,d){
  if(n==null||isNaN(n))return '';
  const m=Math.pow(10,d);let s=(Math.round(n*m)/m).toFixed(d);
  if(d>0)s=s.replace(/(\.\d*?)0+$/,'$1').replace(/\.$/,'');
  if(S.lang===0)s=s.replace(/\d/g,c=>BN[c]);
  return s;
}
function pn(v){
  v=String(v==null?'':v).replace(/[০-৯]/g,c=>BN.indexOf(c)).replace(/[०-९]/g,c=>'०१२३४५६७८९'.indexOf(c)).replace(/,/g,'').trim();
  const n=parseFloat(v);return isNaN(n)?null:n;
}
/* ---------- units ---------- */
function uShatak(){
  const u={shatak:1,katha:S.katha,bigha:S.katha*S.bigha,acre:S.acre,sqft:1/S.sqft,sqm:SQM2SQFT/S.sqft};
  if(S.chh>0)u.chhatak=S.katha/S.chh;
  return u;
}
function sqmToShatak(sqm){return sqm*SQM2SQFT/S.sqft;}
function shatakToSqm(sh){return sh*S.sqft/SQM2SQFT;}
function mixed(sh){
  sh=Math.round(sh*100)/100;const bi=S.katha*S.bigha,ka=S.katha;
  const b=Math.floor(sh/bi+1e-9);const r=Math.round((sh-b*bi)*100)/100;
  const k=Math.floor(r/ka+1e-9);const s=Math.round((r-k*ka)*100)/100;
  const parts=[];
  if(b)parts.push(nf(b,0)+' '+t('bigha'));
  if(k)parts.push(nf(k,0)+' '+t('katha'));
  if(s||!parts.length)parts.push(nf(s,2)+' '+t('shatak'));
  return parts.join(' ');
}
function resultHTML(sqm){
  const sh=sqmToShatak(sqm),u=uShatak();
  let h='<div class="big-res">'+mixed(sh)+'</div><div class="res-grid">';
  ['bigha','katha','shatak','acre','sqft','sqm','chhatak'].forEach(k=>{
    if(!u[k])return;
    h+='<div><span>'+t(k)+'</span><b>'+nf(sh/u[k],(k==='sqft'||k==='sqm')?1:4)+'</b></div>';
  });
  return h+'</div>';
}
function lenFmt(m){return S.len==='m'?nf(m,2)+' '+t('m_s'):nf(m/FT,1)+' '+t('ft_s');}

function saveProject(type,sqm,poly){
  if(!sqm){toast(t('nothing'));return;}
  const def=t(type==='calc'?'calc':type==='gps'?'gps':type==='mouza'?'mouza':type==='cad'?'cad':'layers')+' '+new Date().toLocaleDateString();
  const name=prompt(t('proj_name'),def);if(name===null)return;
  const P=store.get('wb_projects',[]);
  P.unshift({id:Date.now(),name:name||def,type,sqm,poly:poly||null,date:Date.now()});
  store.set('wb_projects',P);toast(t('saved'));
}

const VIEWS=['home','mouza','gps','calc','divide','cad','report','layers','projects','settings','districts'];
const NAVMAP={home:'home',layers:'layers',districts:'layers',projects:'projects',settings:'settings'};
const ON={};
function go(v){if(location.hash.slice(1)===v)show(v);else location.hash=v;}
window.addEventListener('hashchange',()=>show(location.hash.slice(1)||'home'));
function show(v){
  if(!VIEWS.includes(v))v='home';
  VIEWS.forEach(x=>$('#v-'+x).classList.toggle('active',x===v));
  $$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===(NAVMAP[v]||'')));
  window.scrollTo(0,0);
  if(ON[v])ON[v]();
}

/* ======================================================================
   VIEWER (pan / pinch-zoom canvas)
   ====================================================================== */
class Viewer{
  constructor(cv,draw,tap){
    this.c=cv;this.x=cv.getContext('2d');this.draw=draw;this.tap=tap||null;
    this.s=1;this.tx=0;this.ty=0;this.p=new Map();this.moved=0;this.multi=false;this.pinch=null;this.w=300;this.h=300;this.dpr=1;
    cv.addEventListener('pointerdown',e=>this.down(e));
    cv.addEventListener('pointermove',e=>this.move(e));
    const up=e=>this.up(e);
    cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
    cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();this.zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.15:1/1.15);this.redraw();},{passive:false});
    this.resize();
  }
  pos(e){const r=this.c.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
  down(e){
    try{this.c.setPointerCapture(e.pointerId);}catch(x){}
    this.p.set(e.pointerId,this.pos(e));
    if(this.p.size===1){this.moved=0;this.multi=false;}else{this.multi=true;this.pinch=null;}
  }
  move(e){
    if(!this.p.has(e.pointerId))return;
    const cur=this.pos(e);
    if(this.p.size===1){
      const pr=this.p.get(e.pointerId);const dx=cur.x-pr.x,dy=cur.y-pr.y;
      this.tx+=dx;this.ty+=dy;this.moved+=Math.abs(dx)+Math.abs(dy);this.p.set(e.pointerId,cur);this.redraw();
    }else if(this.p.size===2){
      this.p.set(e.pointerId,cur);
      const [a,b]=[...this.p.values()];
      const d=Math.hypot(a.x-b.x,a.y-b.y)||1,c={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
      if(this.pinch){this.zoomAt(c.x,c.y,d/this.pinch.d);this.tx+=c.x-this.pinch.c.x;this.ty+=c.y-this.pinch.c.y;}
      this.pinch={d,c};this.redraw();
    }
  }
  up(e){
    if(!this.p.has(e.pointerId))return;
    const one=this.p.size===1,pos=this.p.get(e.pointerId);
    this.p.delete(e.pointerId);this.pinch=null;
    if(one&&!this.multi&&this.moved<8&&this.tap)this.tap(this.toWorld(pos.x,pos.y),pos);
    if(this.p.size===0)this.multi=false;
  }
  toWorld(px,py){return {x:(px-this.tx)/this.s,y:(py-this.ty)/this.s};}
  zoomAt(px,py,f){const ns=Math.min(80,Math.max(0.02,this.s*f));const k=ns/this.s;this.tx=px-(px-this.tx)*k;this.ty=py-(py-this.ty)*k;this.s=ns;}
  zoom(f){this.zoomAt(this.w/2,this.h/2,f);this.redraw();}
  fit(minx,miny,maxx,maxy){
    const pad=34,sw=(maxx-minx)||1,sh=(maxy-miny)||1;
    this.s=Math.min((this.w-2*pad)/sw,(this.h-2*pad)/sh);
    this.tx=(this.w-sw*this.s)/2-minx*this.s;this.ty=(this.h-sh*this.s)/2-miny*this.s;this.redraw();
  }
  resize(){
    const r=this.c.getBoundingClientRect();if(!r.width)return;
    this.dpr=window.devicePixelRatio||1;
    this.c.width=Math.round(r.width*this.dpr);this.c.height=Math.round(r.height*this.dpr);
    this.w=r.width;this.h=r.height;this.redraw();
  }
  redraw(){
    const x=this.x;x.setTransform(this.dpr,0,0,this.dpr,0,0);
    x.fillStyle='#fff';x.fillRect(0,0,this.w,this.h);
    x.save();x.translate(this.tx,this.ty);x.scale(this.s,this.s);
    this.draw(x,this);x.restore();
  }
}
/* draw a label with white outline; size in screen px */
function label(x,v,txt,px,py,size,color){
  const r=1/v.s;x.save();x.font='bold '+(size*r)+'px sans-serif';x.textAlign='center';x.textBaseline='middle';
  x.lineWidth=3*r;x.strokeStyle='#fff';x.strokeText(txt,px,py);x.fillStyle=color||'#12582b';x.fillText(txt,px,py);x.restore();
}
function boundsOf(pts){
  let a=1e18,b=1e18,c=-1e18,d=-1e18;
  pts.forEach(p=>{a=Math.min(a,p[0]);b=Math.min(b,p[1]);c=Math.max(c,p[0]);d=Math.max(d,p[1]);});
  return [a,b,c,d];
}
function centroid(p){let x=0,y=0;p.forEach(q=>{x+=q[0];y+=q[1];});return [x/p.length,y/p.length];}

const SHAPES={rect:['len','wid'],tri3:['sideA','sideB','sideC'],tribh:['base','height'],trap:['par1','par2','height'],circle:['radius'],quad:['side1','side2','side3','side4','diag']};
let calcOut=null;
function buildShapes(){
  const sel=$('#cShape'),cur=sel.value||'rect';sel.innerHTML='';
  Object.keys(SHAPES).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=t('sh_'+k);sel.appendChild(o);});
  sel.value=cur;buildFields();
}
function buildFields(){
  const sh=$('#cShape').value,box=$('#cFields');const old={};
  box.querySelectorAll('input').forEach(i=>old[i.dataset.k]=i.value);
  box.innerHTML='';
  SHAPES[sh].forEach(k=>{
    const row=document.createElement('div');row.className='row';
    row.innerHTML='<label>'+t(k)+'</label><input data-k="'+k+'" inputmode="decimal" placeholder="0" value="'+esc(old[k]||'')+'">';
    box.appendChild(row);row.querySelector('input').addEventListener('input',calcRun);
  });
  calcRun();

function circlePoly(r){const a=[];for(let i=0;i<72;i++){const th=i/72*2*Math.PI;a.push([r*Math.cos(th),r*Math.sin(th)]);}return a;}
function calcRun(){
  const sh=$('#cShape').value;const f=LF_FACTOR[$('#cLen').value]||FT;
  const v=SHAPES[sh].map(k=>pn($('#cFields input[data-k="'+k+'"]').value));
  const box=$('#cRes');calcOut=null;
  if(v.some(x=>x===null||x<=0)){box.innerHTML='';return;}
  const m=v.map(x=>x*f);let sqm,poly;
  if(sh==='rect'){sqm=m[0]*m[1];poly=[[0,0],[m[0],0],[m[0],m[1]],[0,m[1]]];}
  else if(sh==='tribh'){sqm=m[0]*m[1]/2;poly=[[0,0],[m[0],0],[m[0]/2,m[1]]];}
  else if(sh==='trap'){sqm=(m[0]+m[1])/2*m[2];poly=[[0,0],[m[0],0],[(m[0]+m[1])/2,m[2]],[(m[0]-m[1])/2,m[2]]];}
  else if(sh==='circle'){sqm=Math.PI*m[0]*m[0];poly=circlePoly(m[0]);}
  else if(sh==='tri3'){
    sqm=heron(m[0],m[1],m[2]);
    if(!isFinite(sqm)){box.innerHTML='<div class="warn">'+t('c_invalid')+'</div>';return;}
    const a=m[0],b=m[1],c=m[2],x=(b*b+c*c-a*a)/(2*c),y=Math.sqrt(Math.max(0,b*b-x*x));poly=[[0,0],[c,0],[x,y]];
  }else{
    const [a,b,c,d,e]=m,t1=heron(a,b,e),t2=heron(c,d,e);
    if(!isFinite(t1)||!isFinite(t2)){box.innerHTML='<div class="warn">'+t('c_invalid')+'</div>';return;}
    sqm=t1+t2;
    const x1=(a*a+e*e-b*b)/(2*e),y1=Math.sqrt(Math.max(0,a*a-x1*x1));
    const x3=(d*d+e*e-c*c)/(2*e),y3=-Math.sqrt(Math.max(0,d*d-x3*x3));
    poly=[[0,0],[x1,y1],[e,0],[x3,y3]];
  }
  calcOut={sqm,poly};box.innerHTML=resultHTML(sqm);setLast({type:'calc',sqm,poly});
}
function calcSave(){if(!calcOut){toast(t('nothing'));return;}saveProject('calc',calcOut.sqm,calcOut.poly);}

const DV={tab:1,v:null,poly:null,total:0};
const COLORS=['#2e9a52','#F2B705','#e4572e','#3b8ed0','#8e5ea2','#17a2a2','#d1478c','#8a8f2a'];
function dvTab(n){

function dvModeUI(){const m=$('#dvMode').value;$('#dvEq').style.display=m==='equal'?'flex':'none';$('#dvPc').style.display=m==='pct'?'block':'none';$('#dvCt').style.display=m==='cut'?'flex':'none';}
function dvSources(){
  const sel=$('#dvSrc'),keep=sel.value;sel.innerHTML='';
  const P=store.get('wb_projects',[]).filter(p=>p.poly);
  if(LAST&&LAST.poly){const o=document.createElement('option');o.value='last';o.textContent=t('r_last')+' — '+mixed(sqmToShatak(LAST.sqm));sel.appendChild(o);}

function dvFractions(totalSh){
  const m=$('#dvMode').value;
  if(m==='equal'){const n=Math.round(pn($('#dvN').value)||0);if(n<2||n>20)return {err:t('d_err_n')};return {fr:Array(n).fill(1/n)};}
  if(m==='pct'){
    const a=$('#dvPct').value.split(/[,\s]+/).map(pn).filter(x=>x!==null&&x>0);
    if(!a.length)return {err:t('d_err_pct')};
    const s=a.reduce((p,c)=>p+c,0);if(s>100.01)return {err:t('d_err_pct')};
    const fr=a.map(x=>x/100);if(s<99.99)fr.push((100-s)/100);return {fr};
  }
  const c=pn($('#dvCut').value),u=uShatak()[$('#dvCutU').value];
  if(c===null||c<=0)return {fr:[1]};
  const cs=c*u;if(cs>=totalSh)return {err:t('d_err_cut')};
  return {fr:[cs/totalSh,1-cs/totalSh]};
}
function dvRun(){
  const out=$('#dvOut'),bar=$('#dvBar');out.innerHTML='';bar.innerHTML='';DV.poly=null;
  let totalSh=0,poly=null;
  if(DV.tab===1){
    const v=pn($('#dvTotal').value);if(!v||v<=0){if(DV.v)DV.v.redraw();return;}
    totalSh=v*uShatak()[$('#dvUnit').value];
  }else{
    const sel=$('#dvSrc').value;
    if(sel==='last'&&LAST&&LAST.poly){poly=LAST.poly;totalSh=sqmToShatak(LAST.sqm);}
    else{const p=store.get('wb_projects',[]).find(x=>String(x.id)===sel);if(p&&p.poly){poly=p.poly;totalSh=sqmToShatak(p.sqm);}}
    if(!poly){out.innerHTML='<div class="warn">'+t('d_nosrc')+'</div>';if(DV.v)DV.v.redraw();return;}
  }
  const r=dvFractions(totalSh);
  if(r.err){out.innerHTML='<div class="warn">'+r.err+'</div>';if(DV.v)DV.v.redraw();return;}
  const fr=r.fr;
  let areas=fr.map(f=>f*totalSh),res=null;
  if(poly){
    const ang=pn($('#dvAngle').value)||0;res=divideByFractions(poly,fr,ang);DV.poly={poly,res};
    areas=res.parts.map(p=>sqmToShatak(p.area));
  }
  let h='',b='';
  areas.forEach((a,i)=>{
    const isRest=$('#dvMode').value==='cut'&&fr.length===2&&i===1;
    const name=isRest?t('d_rest'):t('d_part')+' '+nf(i+1,0);
    h+='<div class="it"><span class="dot" style="background:'+COLORS[i%8]+'"></span><div><b>'+name+'</b>: '+mixed(a)+'<br><small>'+nf(a*S.sqft,0)+' '+t('sqft')+' · '+nf(fr[i]*100,1)+'%</small></div></div>';
    b+='<div style="background:'+COLORS[i%8]+';width:'+(fr[i]*100)+'%">'+nf(fr[i]*100,0)+'%</div>';
  });
  out.innerHTML=h;bar.innerHTML='<div class="bar">'+b+'</div>';
  if(DV.v){DV.v.resize();if(poly){const bb=boundsOf(poly.map(p=>[p[0],-p[1]]));DV.v.fit(bb[0],bb[1],bb[2],bb[3]);}}
}
function dvDraw(x,v){
  if(!DV.poly)return;const {poly,res}=DV.poly,r=1/v.s;
  res.parts.forEach((p,i)=>{
    if(p.poly.length<3)return;
    x.beginPath();p.poly.forEach((q,j)=>j?x.lineTo(q[0],-q[1]):x.moveTo(q[0],-q[1]));x.closePath();
    x.fillStyle=COLORS[i%8]+'aa';x.fill();x.lineWidth=2*r;x.strokeStyle='#12582b';x.stroke();
    const c=centroid(p.poly);label(x,v,mixed(sqmToShatak(p.area)),c[0],-c[1],11);
  });
}
['dvTotal','dvUnit','dvMode','dvN','dvPct','dvCut','dvCutU','dvSrc'].forEach(id=>{$('#'+id).addEventListener('input',()=>{if(id==='dvMode')dvModeUI();dvRun();});$('#'+id).addEventListener('change',()=>{if(id==='dvMode')dvModeUI();dvRun();});});

const G={pts:[],watch:null,cur:null,buf:null,busy:false,v:null,xy:[],area:0};
function gmsg(m){$('#gStatus').innerHTML=m;}
function gStart(){

  G.watch=navigator.geolocation.watchPosition(p=>{

  },e=>{gmsg('⚠ '+t('g_err'));G.watch=null;},{enableHighAccuracy:true,maximumAge:0,timeout:25000});
}
function gStatus(){
  if(!G.cur){gmsg(t('g_idle'));return;}

  gmsg('📍 '+G.cur.lat.toFixed(6)+', '+G.cur.lon.toFixed(6)+'<br>'+t('g_acc')+': <b style="color:'+col+'">±'+nf(a,1)+' '+t('m_s')+'</b>');

function gAdd(){
  if(G.busy)return;
  if(!G.cur){gStart();toast(t('g_wait'));return;}
  G.busy=true;G.buf=[];let n=6;const btn=$('#gAddBtn');btn.disabled=true;
  btn.textContent=t('g_avg')+' '+nf(n,0)+'…';
  const iv=setInterval(()=>{
    n--;if(n>0){btn.textContent=t('g_avg')+' '+nf(n,0)+'…';return;}

/* ======================================================================
   CAD
   ====================================================================== */
const C={ents:[],tool:'line',tmp:[],v:null};
function cUnitF(){return S.len==='m'?1:FT;}
function cGrid(){return pn($('#cGrid').value)||0;}
function vertsOf(e){
  if(e.t==='line')return [e.a,e.b];if(e.t==='poly')return e.pts;
  if(e.t==='rect')return [e.a,e.b,[e.a[0],e.b[1]],[e.b[0],e.a[1]]];
  if(e.t==='circ')return [e.c];if(e.t==='text')return [e.p];return [];
}
function cSnap(w){
  let x=w.x,y=w.y;const th=12/C.v.s;let best=null,bd=th;
  C.ents.forEach(e=>vertsOf(e).forEach(p=>{const d=Math.hypot(p[0]-x,p[1]-y);if(d<bd){bd=d;best=p;}}));
  C.tmp.forEach(p=>{const d=Math.hypot(p[0]-x,p[1]-y);if(d<bd){bd=d;best=p;}});
  if(best)return [best[0],best[1]];
  const g=cGrid();if($('#cSnap').checked&&g>0){x=Math.round(x/g)*g;y=Math.round(y/g)*g;}
  return [x,y];
}
function cTap(w){
  const q=cSnap(w);
  switch(C.tool){
    case 'line':C.tmp.push(q);if(C.tmp.length===2){C.ents.push({t:'line',a:C.tmp[0],b:C.tmp[1]});C.tmp=[];}break;
    case 'poly':C.tmp.push(q);break;
    case 'rect':C.tmp.push(q);if(C.tmp.length===2){C.ents.push({t:'rect',a:C.tmp[0],b:C.tmp[1]});C.tmp=[];}break;
    case 'circ':C.tmp.push(q);if(C.tmp.length===2){C.ents.push({t:'circ',c:C.tmp[0],r:Math.hypot(C.tmp[1][0]-C.tmp[0][0],C.tmp[1][1]-C.tmp[0][1])});C.tmp=[];}break;
    case 'text':{const s=prompt(t('c_enter'));if(s)C.ents.push({t:'text',p:q,s});break;}
  }
  cUpdate();
}
function cFinish(){
  if(C.tool==='poly'){
    if(C.tmp.length>=3)C.ents.push({t:'poly',pts:C.tmp.slice()});
    else if(C.tmp.length===2)C.ents.push({t:'line',a:C.tmp[0],b:C.tmp[1]});
    C.tmp=[];
  }else C.tmp=[];
  cUpdate();
}
function cUndo(){if(C.tmp.length)C.tmp.pop();else C.ents.pop();cUpdate();}
function cClear(){C.ents=[];C.tmp=[];cUpdate();}
function cZoom(f){C.v&&C.v.zoom(f);}
function closedShapes(){
  const out=[];
  C.ents.forEach(e=>{
    if(e.t==='poly')out.push({poly:e.pts,area:polyArea(e.pts)});
    else if(e.t==='rect'){const p=[e.a,[e.b[0],e.a[1]],e.b,[e.a[0],e.b[1]]];out.push({poly:p,area:polyArea(p)});}
    else if(e.t==='circ'){const p=circlePoly(e.r).map(q=>[q[0]+e.c[0],q[1]+e.c[1]]);out.push({poly:p,area:Math.PI*e.r*e.r});}
  });
  return out;
}
function cUpdate(){
  $$('#cTools button').forEach(b=>b.classList.toggle('on',b.dataset.c===C.tool));
  $('#cStep').textContent=t('c_h_'+C.tool)+(C.tmp.length?'  ('+nf(C.tmp.length,0)+')':'');
  const sh=closedShapes(),f=cUnitF(),R=$('#cRes2');
  if(!sh.length)R.innerHTML='<div class="hint">'+t('c_none')+'</div>';
  else{
    const last=sh[sh.length-1],sqm=last.area*f*f;
    R.innerHTML=resultHTML(sqm);
    setLast({type:'cad',sqm,poly:last.poly.map(p=>[p[0]*f,-p[1]*f])});
  }
  if(C.v)C.v.redraw();
}
function cDraw(x,v){
  const r=1/v.s,g=cGrid();
  if(g>0&&g*v.s>7){
    const x0=-v.tx/v.s,y0=-v.ty/v.s,x1=(v.w-v.tx)/v.s,y1=(v.h-v.ty)/v.s;
    x.lineWidth=r;x.strokeStyle='#e5ece3';x.beginPath();
    for(let gx=Math.floor(x0/g)*g;gx<=x1;gx+=g){x.moveTo(gx,y0);x.lineTo(gx,y1);}
    for(let gy=Math.floor(y0/g)*g;gy<=y1;gy+=g){x.moveTo(x0,gy);x.lineTo(x1,gy);}
    x.stroke();
  }
  x.strokeStyle='#bcd5c1';x.lineWidth=1.5*r;x.beginPath();x.moveTo(-1e4,0);x.lineTo(1e4,0);x.moveTo(0,-1e4);x.lineTo(0,1e4);x.stroke();
  const U=' '+t(S.len==='m'?'m_s':'ft_s'),seg=(a,b)=>{label(x,v,nf(Math.hypot(b[0]-a[0],b[1]-a[1]),2)+U,(a[0]+b[0])/2,(a[1]+b[1])/2,11,'#333');};
  x.strokeStyle='#1B7A3E';x.lineWidth=2.2*r;x.lineJoin='round';
  C.ents.forEach(e=>{
    if(e.t==='line'){x.beginPath();x.moveTo(e.a[0],e.a[1]);x.lineTo(e.b[0],e.b[1]);x.stroke();seg(e.a,e.b);}
    else if(e.t==='poly'||e.t==='rect'){
      const p=e.t==='poly'?e.pts:[e.a,[e.b[0],e.a[1]],e.b,[e.a[0],e.b[1]]];
      x.beginPath();p.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));x.closePath();x.fillStyle='rgba(27,122,62,.12)';x.fill();x.stroke();
      p.forEach((q,i)=>seg(q,p[(i+1)%p.length]));
      const c=centroid(p),f=cUnitF();label(x,v,mixed(sqmToShatak(polyArea(p)*f*f)),c[0],c[1],12,'#8a6500');
    }else if(e.t==='circ'){
      x.beginPath();x.arc(e.c[0],e.c[1],e.r,0,7);x.fillStyle='rgba(27,122,62,.12)';x.fill();x.stroke();
      const f=cUnitF();label(x,v,'r='+nf(e.r,2)+U,e.c[0],e.c[1]-e.r*0.0,11,'#333');label(x,v,mixed(sqmToShatak(Math.PI*e.r*e.r*f*f)),e.c[0],e.c[1]+14*r,12,'#8a6500');
    }else if(e.t==='text'){label(x,v,e.s,e.p[0],e.p[1],14,'#C62828');}
  });
  if(C.tmp.length){
    x.strokeStyle='#F2B705';x.lineWidth=2.5*r;x.beginPath();C.tmp.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();
    C.tmp.forEach(p=>{x.beginPath();x.arc(p[0],p[1],5*r,0,7);x.fillStyle='#F2B705';x.fill();});
    if(C.tmp.length>1)for(let i=0;i<C.tmp.length-1;i++)seg(C.tmp[i],C.tmp[i+1]);
  }
}
function cSave(){const sh=closedShapes();if(!sh.length){toast(t('c_none'));return;}const f=cUnitF(),l=sh[sh.length-1];saveProject('cad',l.area*f*f,l.poly.map(p=>[p[0]*f,-p[1]*f]));}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}

function cDXF(){
  let s='0\nSECTION\n2\nENTITIES\n';

  C.ents.forEach(e=>{

    else if(e.t==='circ')s+='0\nCIRCLE\n8\n0\n10\n'+e.c[0]+'\n20\n'+(-e.c[1])+'\n30\n0\n40\n'+e.r+'\n';

let MAP=null;const LF={pts:[],mk:[],poly:null,draw:false,pending:null,me:null};
function loadLeaflet(){return new Promise((res,rej)=>{if(window.L)return res();const s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});}

function initMap(){
  loadLeaflet().then(()=>{
    $('#mapMsg').style.display='none';
    if(!MAP){
      MAP=L.map('map').setView([23.8,87.9],7);
      const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
      const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'});
      sat.addTo(MAP);L.control.layers({'Satellite / স্যাটেলাইট':sat,'Street / রাস্তা':osm}).addTo(MAP);
      MAP.on('click',e=>{if(!LF.draw)return;LF.pts.push([e.latlng.lat,e.latlng.lng]);lRender();});
    }
    setTimeout(()=>{MAP.invalidateSize();
      if(LF.pending){if(LF.pending.bounds)MAP.fitBounds(LF.pending.bounds);else MAP.setView(LF.pending.c,LF.pending.z);LF.pending=null;}
    },120);
    lRender();
  }).catch(()=>{const m=$('#mapMsg');m.textContent=t('need_net');m.style.display='block';});
}
function lToggle(){LF.draw=!LF.draw;$('#lDrawBtn').textContent=t(LF.draw?'l_stop':'l_draw');$('#lDrawBtn').classList.toggle('r',LF.draw);$('#lDrawBtn').classList.toggle('y',!LF.draw);}
function lLocate(){
  if(!MAP||!navigator.geolocation){toast(t('g_none'));return;}
  navigator.geolocation.getCurrentPosition(p=>{
    const ll=[p.coords.latitude,p.coords.longitude];MAP.setView(ll,18);
    if(LF.me)MAP.removeLayer(LF.me);LF.me=L.circle(ll,{radius:p.coords.accuracy,color:'#3b8ed0',fillOpacity:.15}).addTo(MAP);
  },()=>toast(t('g_err')),{enableHighAccuracy:true,timeout:20000});
}
function lUndo(){LF.pts.pop();lRender();}
function lClear(){LF.pts=[];lRender();}
function lRender(){
  if(!MAP)return;
  LF.mk.forEach(m=>MAP.removeLayer(m));LF.mk=[];if(LF.poly){MAP.removeLayer(LF.poly);LF.poly=null;}
  LF.pts.forEach((ll,i)=>{
    const m=L.marker(ll,{draggable:true,icon:L.divIcon({className:'ptm',iconSize:[18,18]})}).addTo(MAP);
    m.on('drag',e=>{const p=e.target.getLatLng();LF.pts[i]=[p.lat,p.lng];if(LF.poly)LF.poly.setLatLngs(LF.pts);});
    m.on('dragend',()=>lRender());LF.mk.push(m);
  });
  if(LF.pts.length>=2)LF.poly=L.polygon(LF.pts,{color:'#F2B705',fillColor:'#1B7A3E',fillOpacity:.3,weight:3}).addTo(MAP);

function polySVG(poly){
  if(!poly||poly.length<3)return '';
  const pts=poly.map(p=>[p[0],-p[1]]),[a,b,c,d]=boundsOf(pts),W=300,H=200,pad=14;
  const k=Math.min((W-2*pad)/((c-a)||1),(H-2*pad)/((d-b)||1)),ox=(W-(c-a)*k)/2,oy=(H-(d-b)*k)/2;
  const path=pts.map((p,i)=>(i?'L':'M')+((p[0]-a)*k+ox).toFixed(1)+' '+((p[1]-b)*k+oy).toFixed(1)).join(' ')+' Z';
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:340px;border:1px solid #999;background:#fafafa"><path d="'+path+'" fill="rgba(27,122,62,.25)" stroke="#1B7A3E" stroke-width="2"/></svg>';
}

  $('#reportPaper').innerHTML=h;
}

$$('[data-l]').forEach(b=>b.addEventListener('click',()=>setLang(+b.dataset.l)));
function refreshAll(){
  applyI18n();buildConv();buildShapes();distList();renderProjects();repSources();repBuild();dvSources();dvRun();mUpdate();gUpdate();cUpdate();lRender();
}
function loadSettingsUI(){
  $('#sSqft').value=S.sqft;$('#sKatha').value=S.katha;$('#sBigha').value=S.bigha;$('#sAcre').value=S.acre;$('#sChh').value=S.chh;$('#sLen').value=S.len;
}
[['sSqft','sqft'],['sKatha','katha'],['sBigha','bigha'],['sAcre','acre'],['sChh','chh']].forEach(([id,k])=>{
  $('#'+id).addEventListener('change',()=>{const v=pn($('#'+id).value);if(v===null||v<0||(k!=='chh'&&v===0)){loadSettingsUI();return;}S[k]=v;saveS();refreshAll();});
});
$('#sLen').addEventListener('change',()=>{S.len=$('#sLen').value;saveS();refreshAll();});
$('#cLen').value=S.len;
function resetAll(){if(!confirm(t('s_reset_c')))return;try{localStorage.removeItem('wb_projects');localStorage.removeItem('wb_settings');}catch(e){}location.hash='home';location.reload();}
ON.settings=loadSettingsUI;

/* ---------- start ---------- */
applyI18n();buildConv();buildShapes();distList();
show(location.hash.slice(1)||'home');
</script>
</body>
</html>
